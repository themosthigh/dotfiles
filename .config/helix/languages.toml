[language-server.biome]
command = "biome"
args = ["lsp-proxy"]

[language-server.oxlint]
command = "npx"
args = ["oxlint", "--lsp"]

[language-server.oxfmt]
command = "npx"
args = ["oxfmt", "--lsp"]

[language-server.emmet]
command = "emmet-ls"
args = ["--stdio"]

[language-server.vtsls]
command = "vtsls"
args = ["--stdio"]

[language-server.tailwindcss]
command = "tailwindcss-language-server"

[language-server.colors]
command = "uwu_colors"
args = ["--stdio"]

[language-server.vtsls.config.typescript.inlayHints]
parameterNames = { enabled = "all" }
parameterTypes = { enabled = true }
variableTypes = { enabled = true }
propertyDeclarationTypes = { enabled = true }
enumMemberValues = { enabled = true }

[[language]]
name = "jsx"
auto-format = true
file-types = ["js", "jsx"]
formatter = { command = "prettier", args = ["--parser", "typescript"] }
# Delegating formatting to attached LSPs (oxfmt/biome)
language-servers = [
  # { name = "oxfmt" },
  { name = "vtsls", except-features = ["format"] },
  { name = "emmet" },
  { name = "oxlint" },
]

[[language]]
name = "tsx"
auto-format = true
file-types = ["ts", "tsx"]
formatter = { command = "prettier", args = ["--parser", "typescript"] }
language-servers = [
  # { name = "oxfmt" },
  { name = "oxlint" },
  { name = "vtsls", except-features = ["format"] },
  { name = "tailwindcss" },
  { name = "emmet" },
]

[[language]]
name = "css"
auto-format = true
file-types = ["css"]
formatter = { command = "prettier", args = ["--parser", "css"] }
language-servers = [
  { name = "vscode-css-language-server" },
  { name = "tailwindcss" },
  { name = "colors" },
]

[[language]]
name = "markdown"
file-types = ["md", "mdx"]
formatter = { command = "prettier", args = ["--parser", "markdown"] }
